; PlatformIO Project Configuration File
;
; Switchboard: BLE controlled general purpose IO board
; Target: Arduino Nano ESP32 (ESP32-S3)
;
; Uploading: the Nano ESP32 uses a DFU bootloader. If the upload does not start,
; double-tap the reset button (LED turns green) and run the upload again.

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_filters = default, colorize, esp32_exception_decoder, time

build_flags = -D BOARD_ARDUINO_NANO_ESP32

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.0
