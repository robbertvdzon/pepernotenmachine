[platformio]
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_unflags = -DBOARD_HAS_PIN_REMAP

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ^9.1.0
    h2zero/NimBLE-Arduino @ ^1.4.0

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D LV_CONF_SKIP
    ; 1-bit pixel font for small captions (the 8x16 text font is src/fonts/font_pixel_16.c)
    -D LV_FONT_UNSCII_8=1
